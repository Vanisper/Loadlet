packages:
  - apps/*
  - packages/*
  - examples/*
  - tools/*

catalogMode: prefer

catalogs:
  runtime:
    chokidar: ^6.0.0
    tsx: ^4.23.15
  tooling:
    "@types/node": ^24
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
  parsers:
    "@types/ini": ^4.1.1
    ini: ^7.0.0
    yaml: ^2.9.1
overrides:
  vite@*: "catalog:tooling"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
